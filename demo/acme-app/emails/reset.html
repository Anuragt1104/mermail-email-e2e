<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f5f9;font-family:Helvetica,Arial,sans-serif;color:#1d2433">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;padding:36px">
            <tr><td style="font-size:20px;font-weight:700;color:#4f46e5">Acme Notes</td></tr>
            <tr><td style="padding-top:20px;font-size:16px">Hi {{name}},</td></tr>
            <tr><td style="padding-top:12px;font-size:16px">Use this code to reset your password:</td></tr>
            <tr><td style="padding:22px 0;font-size:32px;font-weight:700;letter-spacing:8px">{{code}}</td></tr>
            <tr><td style="font-size:13px;color:#6b7280">The code expires in 10 minutes. If you did not ask to reset your password, ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
