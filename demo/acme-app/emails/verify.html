<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f5f9;font-family:Helvetica,Arial,sans-serif;color:#1d2433">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:32px 12px">
          <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;padding:36px">
            <tr><td style="font-size:20px;font-weight:700;color:#4f46e5">Acme Notes</td></tr>
            <tr><td style="padding-top:20px;font-size:16px">Hi {{firstName}},</td></tr>
            <tr>
              <td style="padding-top:12px;font-size:16px;line-height:1.5">
                Thanks for signing up. Confirm your email address to activate your account.
              </td>
            </tr>
            <tr>
              <td style="padding:28px 0">
                <a href="{{verifyUrl}}" style="background:#4f46e5;color:#ffffff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600">Confirm email</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;color:#6b7280;line-height:1.5">
                This link expires in 24 hours. If you did not create an Acme Notes account, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
